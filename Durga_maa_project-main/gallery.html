<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gallery | Shree Shree Durga Puja</title>

    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" media="screen and (max-width:1140px)"
            href="gallerymobile.css" type="text/css">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>


    <main>

        <!-- =========================
             GALLERY HERO
        ========================== -->

        <section class="gallery-page-hero">

            <span class="gallery-page-subtitle">
                MEMORIES & MOMENTS
            </span>

            <h1>
                DURGA PUJA <span>GALLERY</span>
            </h1>

            <div class="gallery-line"></div>

            <p>
                Hamari Durga Puja ke kuch yaadgaar pal,
                bhakti aur utsav ki tasveerein.
            </p>

            <a href="index.html#gallery" class="gallery-back-btn">
                ← Back to Gallery
            </a>

        </section>


        <!-- =========================
             ALL PHOTOS
        ========================== -->

        <section class="all-gallery-section">

            <div
                id="allGalleryGrid"
                class="all-gallery-grid"
            ></div>

        </section>


    </main>


    <!-- =========================
         LIGHTBOX
    ========================== -->

    <div class="gallery-lightbox">

        <button
            class="gallery-lightbox-close"
            type="button"
        >
            ×
        </button>


        <button
            class="gallery-lightbox-prev"
            type="button"
        >
            ←
        </button>


        <img
            class="gallery-lightbox-image"
            src=""
            alt=""
        >


        <button
            class="gallery-lightbox-next"
            type="button"
        >
            →
        </button>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="gallery-page-footer">

        <h2>
            Jai Maa Durga
        </h2>

        <p>
            श्री दुर्गा पूजा सेवा समिति 
        </p>

    </footer>


    <script src="gallery.js"></script>

</body>

</html>
